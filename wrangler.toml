name = "reader"
main = "src/worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat_v2"]

assets = { directory = "dist", binding = "ASSETS", run_worker_first = ["/api/*", "/"] }

[placement]
mode = "smart"

routes = [
  { pattern = "reader.sassmaker.com/*", zone_name = "sassmaker.com" }
]

[observability]
enabled = true
head_sampling_rate = 0.1

[limits]
cpu_ms = 30000

[vars]
NODE_ENV = "production"
AI_BASE_URL = "https://free-ai-gateway.sarthakagrawal927.workers.dev/v1"

[[r2_buckets]]
binding = "PDFS_BUCKET"
bucket_name = "reader-pdfs"