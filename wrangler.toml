name = "reader"
main = "src/worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat_v2"]

assets = { directory = "dist", binding = "ASSETS", run_worker_first = ["/api/*", "/"] }

routes = [
  { pattern = "read.significanthobbies.com", custom_domain = true }
]

[placement]
mode = "smart"

[observability]
enabled = true
head_sampling_rate = 0.1

[limits]
cpu_ms = 30000

[vars]
NODE_ENV = "production"
AI_BASE_URL = "https://ai-gateway.sassmaker.com/v1"
BETTER_AUTH_URL = "https://read.significanthobbies.com"

[[r2_buckets]]
binding = "PDFS_BUCKET"
bucket_name = "reader-pdfs"
