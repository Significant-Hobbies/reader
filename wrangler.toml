name = "reader"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat_v2"]
main = ".open-next/worker.js"
assets = { directory = ".open-next/assets", binding = "ASSETS" }

# psi-swarm flagged TTFB > 1s as the dominant LCP contributor. Smart
# placement runs the Worker near Turso so server components don't pay
# a cross-region RTT on every request.
[placement]
mode = "smart"

[observability]
enabled = true
head_sampling_rate = 0.1

[limits]
cpu_ms = 30000

[vars]
NODE_ENV = "production"
# All AI traffic is centralized through free-ai-gateway (single Workers AI
# chokepoint with daily Neuron budget enforcement). Override per-env if needed.
AI_BASE_URL = "https://free-ai-gateway.sarthakagrawal927.workers.dev/v1"

[[r2_buckets]]
binding = "PDFS_BUCKET"
bucket_name = "reader-pdfs"

# TODO: Vectorize index `reader-articles` requires API token w/ Vectorize:Edit
# perms. After granting, run:
#   wrangler vectorize create reader-articles --preset=@cf/baai/bge-base-en-v1.5
# then uncomment the binding below.
