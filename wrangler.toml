name = "reader"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat_v2"]
main = ".open-next/worker.js"
assets = { directory = ".open-next/assets", binding = "ASSETS" }

[observability]
enabled = true
head_sampling_rate = 0.1

[limits]
cpu_ms = 30000

[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

[vars]
NODE_ENV = "production"

[[r2_buckets]]
binding = "PDFS_BUCKET"
bucket_name = "reader-pdfs"

[ai]
binding = "AI"

