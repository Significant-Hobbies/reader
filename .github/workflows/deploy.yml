name: Deploy to Cloudflare Workers
on:
  push:
    branches: [main, migrate-off-firebase]
    paths:
      - '.github/workflows/deploy.yml'
      - 'src/**'
      - 'public/**'
      - 'scripts/fix-opennext-deps.mjs'
      - 'scripts/patch-opennext.mjs'
      - 'patches/**'
      - 'drizzle.config.ts'
      - 'next.config.ts'
      - 'open-next.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'postcss.config.mjs'
      - 'tsconfig.json'
      - 'wrangler.toml'
  pull_request:
    branches: [main]

jobs:
  deploy-production:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate:env:build
      - name: Validate Cloudflare runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '7d048325699a5acddb44d3be31cf6ba9' }}
          REQUIRED_SECRETS: BETTER_AUTH_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET TURSO_AUTH_TOKEN TURSO_DATABASE_URL
        run: |
          set -euo pipefail
          secret_names="$(pnpm exec wrangler secret list --format json | node -e "let input='';process.stdin.on('data',c=>input+=c);process.stdin.on('end',()=>{const parsed=JSON.parse(input);console.log(parsed.map((item)=>item.name).join('\n'))})")"
          for required in $REQUIRED_SECRETS; do
            if ! grep -qx "$required" <<< "$secret_names"; then
              echo "Missing Cloudflare runtime secret: $required"
              exit 1
            fi
          done
      - run: pnpm cf:build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '7d048325699a5acddb44d3be31cf6ba9' }}
          NEXT_TELEMETRY_DISABLED: 1
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '7d048325699a5acddb44d3be31cf6ba9' }}
          command: deploy
      - name: Smoke check production
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 20 https://reader.sarthakagrawal927.workers.dev/ > /dev/null

  deploy-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm cf:build
