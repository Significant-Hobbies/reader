name: AI Code Review
on: workflow_dispatch

# Temporarily manual-only: the referenced reviewer action has no `v1` tag,
# which made every PR show a failed review check before code ran.

permissions:
  contents: read

jobs:
  review:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Trigger Enterprise Reviewer
        uses: sarthakagrawal927/code-reviewer-action@v1
        with:
          platform_base_url: ${{ secrets.CODE_REVIEWER_PLATFORM_BASE_URL }}
          platform_token: ${{ secrets.CODE_REVIEWER_PLATFORM_TOKEN }}
          workflow_run_id: ${{ github.run_id }}
